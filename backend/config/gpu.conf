# solstice GPU / rendering tuning — sourced by backend/scripts/solstice on
# every "solstice start" (see boot_shell). This file is user config: install.sh
# preserves backend/config/ across updates, so edits here survive.
#
# Defaults (used when a variable is unset below AND in the environment) target
# an NVIDIA card with VSync off and hardware rendering:
#
#   QSG_RENDER_LOOP=threaded     render thread; Qt's "basic" loop stutters
#   QSG_RHI_BACKEND=opengl       stable RHI path on the proprietary driver
#   QT_OPENGL=desktop            never software/GLES fallback
#   __GL_SYNC_TO_VBLANK=0        NVIDIA VSync off (X11/XWayland)
#   vblank_mode=0                Mesa VSync off (portable twin)
#   __GL_YIELD=USLEEP            stop the NVIDIA busy-wait core spin
#
# Values exported before "solstice start" always win, then this file, then the
# script defaults. Uncomment a line to pin it here.
#
# Wayland note: presentation/VSync is owned by the compositor, so the VSync
# switches above only apply to X11/XWayland clients. Configure tearing/VFR in
# your compositor for a true no-VSync Wayland session.
#
# VMs: the launcher exports LIBGL_ALWAYS_SOFTWARE=1 on virtual machines (and
# on machines without a DRM render node) so Mesa skips the hardware DRI2 probe,
# which otherwise logs "libEGL warning: egl: failed to create dri2 screen" and
# falls back to llvmpipe anyway. Uncomment the line below to keep hardware
# rendering in a VM with working virgl/venus.
# LIBGL_ALWAYS_SOFTWARE=0
#
# Frame pacing (V-Sync / frame cap) is owned by Settings > Setup >
# Experimental > Debug: backend/scripts/solstice translates
# backend/config/debug.json into QSG_USE_SIMPLE_ANIMATION_DRIVER /
# QSG_FIXED_ANIMATION_STEP on every start. Setting either variable here
# overrides those settings (the launcher only fills in unset values).
#
# QSG_RENDER_LOOP=threaded
# QSG_RHI_BACKEND=opengl
# QT_OPENGL=desktop
# __GL_SYNC_TO_VBLANK=0
# vblank_mode=0
# __GL_YIELD=USLEEP
#
# Measuring (uncomment, restart, read logs/startup.log or "quickshell log"):
#   QSG_INFO=1           one-shot render loop / backend / GPU info at startup
#   QSG_RENDER_TIMING=1  per-frame timings (sync/render/swap + blocked time);
#                        use while opening/closing panels to spot dropped frames
#   QSG_VISUALIZE=overdraw   overlay that shows overdraw hotspots (batches,
#                            changes, clip are the other validators)

# Pinned by Settings > Setup > Experimental.
QSG_RHI_BACKEND=vulkan
